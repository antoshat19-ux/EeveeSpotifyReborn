name: Build IPA

on:
  workflow_dispatch: # запуск вручную
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build IPA
        run: |
          xcodebuild -scheme EeveeSpotifyReborn \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/EeveeSpotifyReborn.xcarchive archive
          xcodebuild -exportArchive \
                     -archivePath build/EeveeSpotifyReborn.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: EeveeSpotifyReborn-ipa
          path: build/*.ipa
